name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: chordus
          POSTGRES_PASSWORD: chordus
          POSTGRES_DB: chordus_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U chordus"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TZ: Asia/Colombo
      DATABASE_URL_TEST: postgres://chordus:chordus@localhost:5432/chordus_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - name: Unit and RLS tests
        run: npm test
      - name: Build
        run: npm run build
        env:
          CHORDUS_DEMO_MODE: "true"
      - run: npx playwright install --with-deps chromium
      - name: End-to-end tests (demo mode)
        run: npm run test:e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
